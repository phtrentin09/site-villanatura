[build]
  publish = "."

[[redirects]]
  from = "/avaliar"
  to = "https://www.google.com/maps/search/?api=1&query=Villa+Natura+Resid%C3%AAncia+S%C3%A9nior+Palmela"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
